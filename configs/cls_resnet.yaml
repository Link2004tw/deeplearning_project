# Run: python -m src.cli train --config configs/cls_resnet.yaml
seed: 42

data:
  root: data/cub
  image_size: 224
  batch_size: 32
  num_workers: 4
  val_split: 0.1
  subset: null
  augmentation:
    crop_min_scale: 0.6
    flip_prob: 0.5
    rotation_deg: 15
    color_jitter: 0.2

model:
  encoder: resnet18
  num_classes: 200
  encoder_kwargs:
    pretrained: true
    freeze: none
    unfreeze_last_n: 1

train:
  run_name: resnet18
  output_dir: outputs/checkpoints/resnet18
  epochs: 15
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  early_stopping:
    monitor: val_acc
    patience: 5

tracking:
  backend: mlflow
  experiment: cub200-classification
  run_name: resnet18
