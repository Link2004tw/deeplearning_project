# Run: python -m src.cli train --config configs/cls_resnet50.yaml
run_name: resnet50
seed: 42

data:
  root: data/cub
  image_size: 256
  batch_size: 8
  num_workers: 0
  val_split: 0.1
  subset: null
  augmentation:
    crop_min_scale: 0.6
    flip_prob: 0.5
    rotation_deg: 15
    color_jitter: 0.2

model:
  encoder: resnet50
  num_classes: 200
  encoder_kwargs:
    pretrained: true
    freeze: none
    unfreeze_last_n: 1
    unfreeze_blocks: 0

train:
  run_name: resnet50
  output_dir: outputs/checkpoints/resnet50
  epochs: 30
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  amp: true
  label_smoothing: 0.1
  discriminative_lr: true
  backbone_lr_mult: 0.1
  warmup_epochs: 3
  mixup_alpha: 0.2
  cutmix_alpha: 0.0
  early_stopping:
    monitor: val_acc
    patience: 7
    min_epochs: 5

tracking:
  backend: mlflow
  experiment: cub200-classification
  run_name: resnet50
