# Multi-phase fine-tuning for ResNet (same architecture, staged training).
# Run: python -m src.cli train --config configs/cls_resnet_finetune.yaml
run_name: resnet18_finetune
seed: 42
tta: true

data:
  root: data/cub
  image_size: 224
  batch_size: 16
  num_workers: 0
  val_split: 0.1
  subset: null
  augmentation:
    crop_min_scale: 0.6
    flip_prob: 0.5
    rotation_deg: 15
    color_jitter: 0.2

model:
  encoder: resnet18
  num_classes: 200
  dropout: 0.3
  encoder_kwargs:
    pretrained: true

phases:
  - name: head_only
    model:
      encoder_kwargs:
        freeze: backbone
    train:
      run_name: resnet18_phase1_head
      output_dir: outputs/checkpoints/resnet18_phase1_head
      epochs: 10
      optimizer: adamw
      lr: 0.001
      weight_decay: 0.0001
      scheduler: cosine
      grad_clip: 1.0
      early_stopping:
        monitor: val_acc
        patience: 5

  - name: layer4_unfreeze
    model:
      encoder_kwargs:
        freeze: partial
        unfreeze_last_n: 1
    train:
      run_name: resnet18_phase2_layer4
      output_dir: outputs/checkpoints/resnet18_phase2_layer4
      epochs: 15
      optimizer: adamw
      lr: 0.0001
      weight_decay: 0.0001
      discriminative_lr: true
      backbone_lr_mult: 0.1
      warmup_epochs: 3
      scheduler: cosine
      label_smoothing: 0.1
      mixup_alpha: 0.2
      grad_clip: 1.0
      early_stopping:
        monitor: val_acc
        patience: 7
        min_epochs: 5

  - name: full_finetune
    model:
      encoder_kwargs:
        freeze: none
    train:
      run_name: resnet18_phase3_full
      output_dir: outputs/checkpoints/resnet18_phase3_full
      epochs: 30
      optimizer: adamw
      lr: 0.00005
      weight_decay: 0.0001
      discriminative_lr: true
      backbone_lr_mult: 0.1
      warmup_epochs: 3
      scheduler: cosine
      label_smoothing: 0.1
      mixup_alpha: 0.2
      cutmix_alpha: 1.0
      grad_clip: 1.0
      early_stopping:
        monitor: val_acc
        patience: 10
        min_epochs: 10

tracking:
  backend: mlflow
  experiment: cub200-classification
  run_name: resnet18_finetune
