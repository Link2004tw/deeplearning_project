# Run: python -m src.cli train --config configs/cls_scratch.yaml
run_name: scratch_cnn
seed: 42

data:
  root: data/cub
  image_size: 224
  batch_size: 32
  num_workers: 0
  val_split: 0.1
  subset: null
  augmentation:
    crop_min_scale: 0.4
    flip_prob: 0.5
    rotation_deg: 30
    color_jitter: 0.3

model:
  encoder: scratch_cnn
  num_classes: 200
  encoder_kwargs:
    feature_dim: 512
    dropout: 0.3

train:
  run_name: scratch_cnn
  output_dir: outputs/checkpoints/scratch_cnn
  epochs: 60
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.001
  scheduler: cosine
  amp: true
  early_stopping:
    monitor: val_acc
    patience: 10

tracking:
  backend: mlflow
  experiment: cub200-classification
  run_name: scratch_cnn
