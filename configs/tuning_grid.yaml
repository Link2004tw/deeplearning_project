# Run: python -m src.cli tune --task classification --config configs/tuning_grid.yaml
search:
  method: grid
  seed: 42

space:
  train.lr: [0.01, 0.001, 0.0001]
  train.batch_size: [32, 64]
  train.weight_decay: [0.0, 0.0001, 0.001]

# Reduced budget so grid and random are compared fairly.
base_config: configs/cls_scratch.yaml
budget:
  epochs: 3
  subset: 4000

tracking:
  backend: mlflow
  experiment: cub200-tuning

# Grid search space (small for compute budget)
lr:
  type: float
  low: 0.0001
  high: 0.01
  step: 0.0005
  log: true

batch_size:
  type: categorical
  values: [32, 64]

weight_decay:
  type: float
  low: 0.0
  high: 0.001
  step: 0.0005

optimizer:
  type: categorical
  values: ["adam", "sgd"]
